<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>Sona</title>
  <meta name="description" content="Sona — dein promptbarer, unendlicher Music-Stream" />
  <meta name="theme-color" content="#101216" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/icons/icon-192.png" />
  <link rel="stylesheet" href="/style.css" />
</head>
<body>
  <!-- the world: pixi-rendered silhouette scene -->
  <div id="scene"></div>
  <div id="vignette"></div>
  <div id="grain"></div>

  <!-- landing -->
  <main id="landing">
    <div id="float-prompts"></div>
    <h1 class="wordmark">Sona</h1>
    <p class="tagline">An infinite stream, tuned to a single thought.</p>
    <form id="seed-form" autocomplete="off">
      <input id="seed-input" type="text" placeholder="What do you want to hear?" maxlength="300" />
      <button type="submit" id="seed-send" aria-label="Generate">
        <svg viewBox="0 0 24 24"><path d="M4 12h14"/><path d="M13 6l6 6-6 6"/></svg>
      </button>
    </form>

    <section id="social-proof">
      <div class="sp-row">
        <div class="sp-avatars"></div>
        <div class="sp-stats">
          Loved by <b>128k+</b> night owls · <b data-countup="2400000">0</b> tracks dreamed up
          <span class="sp-stars">★★★★★</span>
        </div>
      </div>
      <div class="sp-live"><span class="sp-dot"></span><span id="sp-ticker">tuning the first stream of the night …</span></div>
    </section>
  </main>

  <!-- player -->
  <main id="player" hidden>
    <header id="topbar">
      <a class="logo" href="/">Sona</a>
    </header>

    <section id="now">
      <div id="now-state"></div>
      <h2 id="now-title"></h2>
      <p id="now-hint"></p>
    </section>

    <!-- center stage: lyrics -->
    <section id="stage">
      <div id="lyrics"></div>
    </section>

    <section id="transport">
      <div id="progress"><div id="progress-fill"></div><div id="progress-knob"></div></div>
      <div id="times"><span id="t-cur">0:00</span><span id="t-dur">–:––</span></div>
      <div id="controls">
        <button id="btn-play" aria-label="Play">
          <svg viewBox="0 0 24 24"><path class="icon-play" d="M8 5.5v13l10.5-6.5z"/><g class="icon-pause" style="display:none"><rect x="7" y="5" width="3.4" height="14" rx="1"/><rect x="13.6" y="5" width="3.4" height="14" rx="1"/></g></svg>
        </button>
        <button id="btn-next" aria-label="Next track">
          <svg viewBox="0 0 24 24"><path d="M6 5.5v13l9-6.5z"/><rect x="16.4" y="5.5" width="2.6" height="13" rx="1.2"/></svg>
        </button>
      </div>
    </section>

    <section id="queue-wrap">
      <h3 id="queue-title">Up Next</h3>
      <div id="queue"></div>
    </section>

    <footer id="composer">
      <div id="suggestions"></div>
      <form id="prompt-form" autocomplete="off">
        <input id="prompt-input" type="text" placeholder="Describe the next track …" maxlength="300" />
        <button type="submit" id="prompt-send" aria-label="Send">
          <svg viewBox="0 0 24 24"><path d="M4 12h14"/><path d="M13 6l6 6-6 6"/></svg>
        </button>
      </form>
    </footer>
  </main>

  <!-- provider switch, deliberately quiet -->
  <button id="btn-settings" aria-label="Engine">·</button>
  <div id="settings-panel" hidden>
    <span>Engine</span>
    <button data-provider="lyria">Lyria</button>
    <button data-provider="elevenlabs">ElevenLabs</button>
  </div>

  <script src="/vendor/gsap.min.js"></script>
  <script type="module" src="/app.js"></script>
</body>
</html>
